name: Keep Render Awake

on:
  schedule:
    # Run every 3 minutes to prevent Render free tier from sleeping (sleeps after 15m)
    # GitHub often delays cron jobs, so 3 mins ensures it hits before the 15m window closes.
    - cron: '*/3 * * * *'
  workflow_dispatch: # Allow manual trigger

# The point of this job is to keep one backend warm. Only one ping needs to be
# in flight at a time; a backed-up queue of them helps nobody.
concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend and frontend
        run: |
          # The backend is what actually sleeps: Render's free tier idles after
          # 15m and a cold start measured >40s. Vercel doesn't sleep, but the
          # ping is cheap and warms the edge.
          BACKEND="https://gethired-backend-sqnz.onrender.com/health"
          FRONTEND="https://hiring-24-x-7.vercel.app"

          fail=0
          for url in "$BACKEND" "$FRONTEND"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 90 -L "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "ok    $code  $url"
            else
              echo "::warning::keepalive got HTTP $code from $url"
              fail=1
            fi
          done

          # Report unhealthy targets instead of silently "succeeding" forever.
          # This job passed for weeks while pinging get-hired-rose.vercel.app,
          # which had been returning 500 — a green check that meant nothing.
          if [ "$fail" = "1" ]; then
            echo "::error::One or more keepalive targets are unhealthy."
            exit 1
          fi
          echo "All targets healthy."
