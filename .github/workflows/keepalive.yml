name: Keep Render Awake

on:
  schedule:
    # Run every 3 minutes to prevent Render free tier from sleeping (sleeps after 15m)
    # GitHub often delays cron jobs, so 3 mins ensures it hits before the 15m window closes.
    - cron: '*/3 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend and Frontend
        run: |
          echo "Pinging backend and frontend to keep them awake..."
          curl -s https://gethired-backend-sqnz.onrender.com/docs > /dev/null
          curl -s https://get-hired-rose.vercel.app > /dev/null
          echo "Done."
